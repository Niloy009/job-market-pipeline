<svg viewBox="0 0 860 600" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Inter', 'Segoe UI', sans-serif">
  <title>Job Market Pipeline Architecture</title>
  <desc>End-to-end architecture: Bundesagentur API → Airbyte → BigQuery → Dagster orchestration → Ollama LLM enrichment → BigQuery enriched layer</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366f1"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="600" fill="#0f172a" rx="12"/>

  <!-- Title -->
  <text x="430" y="38" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="600" letter-spacing="0.3">Job Market Pipeline</text>
  <text x="430" y="56" text-anchor="middle" fill="#64748b" font-size="11">Bundesagentur API · Airbyte · Dagster · BigQuery · Ollama</text>

  <!-- LAYER LABELS -->
  <text x="28" y="112" fill="#475569" font-size="10" font-weight="600" letter-spacing="1">SOURCE</text>
  <text x="28" y="232" fill="#475569" font-size="10" font-weight="600" letter-spacing="1">INGESTION</text>
  <text x="28" y="352" fill="#475569" font-size="10" font-weight="600" letter-spacing="1">ORCHESTRATION</text>
  <text x="28" y="472" fill="#475569" font-size="10" font-weight="600" letter-spacing="1">STORAGE</text>

  <!-- LANE BACKGROUNDS -->
  <rect x="120" y="80" width="716" height="76" rx="8" fill="#1e293b"/>
  <rect x="120" y="200" width="716" height="76" rx="8" fill="#1e293b"/>
  <rect x="120" y="320" width="716" height="118" rx="8" fill="#1e293b"/>
  <rect x="120" y="452" width="716" height="76" rx="8" fill="#1e293b"/>

  <!-- SOURCE LAYER -->
  <rect x="280" y="94" width="160" height="48" rx="7" fill="#1d2d44" stroke="#334155" stroke-width="1.2"/>
  <text x="360" y="116" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">Bundesagentur API</text>
  <text x="360" y="132" text-anchor="middle" fill="#64748b" font-size="9.5">Job search + detail endpoints</text>

  <rect x="480" y="94" width="130" height="48" rx="7" fill="#1d2d44" stroke="#334155" stroke-width="1.2"/>
  <text x="545" y="116" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="600">Dagster Schedule</text>
  <text x="545" y="132" text-anchor="middle" fill="#64748b" font-size="9.5">Daily · 08:00 UTC</text>

  <!-- INGESTION LAYER -->
  <rect x="200" y="214" width="190" height="48" rx="7" fill="#1d2d44" stroke="#6366f1" stroke-width="1.5"/>
  <text x="295" y="235" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="600">Airbyte Connector</text>
  <text x="295" y="251" text-anchor="middle" fill="#64748b" font-size="9.5">bundesagentur_source.yaml</text>

  <rect x="430" y="214" width="165" height="48" rx="7" fill="#1d2d44" stroke="#6366f1" stroke-width="1.5"/>
  <text x="512" y="235" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="600">raw_job_postings</text>
  <text x="512" y="251" text-anchor="middle" fill="#64748b" font-size="9.5">Dagster asset · group: ingestion</text>

  <!-- ORCHESTRATION LAYER -->
  <rect x="148" y="336" width="160" height="48" rx="7" fill="#1d2d44" stroke="#10b981" stroke-width="1.5"/>
  <text x="228" y="357" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="600">job_details</text>
  <text x="228" y="373" text-anchor="middle" fill="#64748b" font-size="9.5">Fetch descriptions · CSV</text>

  <rect x="350" y="336" width="180" height="48" rx="7" fill="#1d2d44" stroke="#10b981" stroke-width="1.5"/>
  <text x="440" y="357" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="600">enriched_job_postings</text>
  <text x="440" y="373" text-anchor="middle" fill="#64748b" font-size="9.5">Dagster asset · group: enrichment</text>

  <rect x="574" y="336" width="140" height="48" rx="7" fill="#1d2d44" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="644" y="357" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="600">Ollama · LLaMA 3.1</text>
  <text x="644" y="373" text-anchor="middle" fill="#64748b" font-size="9.5">Local LLM · skill extraction</text>

  <rect x="730" y="336" width="90" height="48" rx="7" fill="#1d2d44" stroke="#334155" stroke-width="1.2"/>
  <text x="775" y="357" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">Terraform</text>
  <text x="775" y="373" text-anchor="middle" fill="#64748b" font-size="9.5">BQ provisioning</text>

  <!-- STORAGE LAYER -->
  <rect x="200" y="466" width="175" height="48" rx="7" fill="#1d2d44" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="287" y="487" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="600">BigQuery · raw_jobs</text>
  <text x="287" y="503" text-anchor="middle" fill="#64748b" font-size="9.5">job_postings table · 751 rows</text>

  <rect x="420" y="466" width="175" height="48" rx="7" fill="#1d2d44" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="507" y="487" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="600">BigQuery · raw_jobs</text>
  <text x="507" y="503" text-anchor="middle" fill="#64748b" font-size="9.5">enriched_jobs table</text>

  <!-- ARROWS -->
  <line x1="545" y1="142" x2="530" y2="214" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="340" y1="142" x2="295" y2="214" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="390" y1="238" x2="430" y2="238" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="480" y1="262" x2="320" y2="466" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="287" y1="466" x2="250" y2="384" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="310" y1="142" x2="218" y2="336" stroke="#10b981" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="308" y1="360" x2="350" y2="360" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="574" y1="360" x2="530" y2="360" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="384" x2="490" y2="466" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="758" y1="384" x2="610" y2="466" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- LEGEND -->
  <rect x="130" y="548" width="580" height="36" rx="6" fill="#1e293b"/>
  <line x1="155" y1="566" x2="185" y2="566" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="193" y="570" fill="#94a3b8" font-size="10">Airbyte sync</text>
  <line x1="270" y1="566" x2="300" y2="566" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="308" y="570" fill="#94a3b8" font-size="10">Data flow</text>
  <line x1="380" y1="566" x2="410" y2="566" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="418" y="570" fill="#94a3b8" font-size="10">LLM enrichment</text>
  <line x1="510" y1="566" x2="540" y2="566" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="548" y="570" fill="#94a3b8" font-size="10">Schedule trigger</text>
</svg>
